<?xml version="1.0" encoding="UTF-8"?>
<!-- Import test for xTool Studio. See laser/NOTES.md.
     Deliberately breaks our own rules (transform, text, duplicate lines),
     so scripts/check_svg.py is expected to FAIL on this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="60mm" viewBox="0 0 100 60">
  <!-- 1, 2: cut convention -->
  <rect x="0" y="0" width="100" height="60" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <circle cx="12" cy="12" r="6" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <!-- 3: score convention -->
  <line x1="24" y1="6" x2="24" y2="18" fill="none" stroke="#0000ff" stroke-width="0.1"/>
  <path d="M 30 18 C 34 2, 40 2, 44 18" fill="none" stroke="#0000ff" stroke-width="0.1"/>
  <!-- 5: engrave fill -->
  <rect x="50" y="6" width="12" height="12" fill="#000000" stroke="none"/>
  <!-- 6: colour print fill -->
  <circle cx="76" cy="12" r="6" fill="#22aa66" stroke="none"/>
  <!-- 7: fill and stroke together -->
  <rect x="6" y="26" width="20" height="10" fill="#ff8800" stroke="#000000" stroke-width="0.5"/>
  <!-- 8: transform; should land at x=70..90, y=40..50 -->
  <g transform="translate(60 30)">
    <rect x="10" y="10" width="20" height="10" fill="#8800cc" stroke="none"/>
  </g>
  <!-- 9: live text -->
  <text x="32" y="34" font-family="Arial" font-size="6" fill="#000000">Text 123</text>
  <!-- 10: duplicate lines -->
  <line x1="6" y1="54" x2="60" y2="54" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <line x1="6" y1="54" x2="60" y2="54" fill="none" stroke="#ff0000" stroke-width="0.1"/>
</svg>
